<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دلتا - المنصة الكاملة</title>
<style>
:root{--bg:#0b1220;--card:#111c33;--card2:#16233d;--text:#e8eefc;--muted:#9fb0cc;--line:#1f2d4a;--acc:#4cc9f0;--acc2:#b388ff;--ok:#3ddc97;--bad:#ff6b6b;--warn:#f59e0b;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;margin:0;padding:14px;overflow-x:hidden}
.wrap{max-width:800px;margin:0 auto;display:none}
h2{color:var(--acc);margin-top:0;text-align:center}
h3{font-size:16px;margin:20px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
label{display:block;margin-bottom:10px;font-size:13px;color:var(--muted);font-weight:bold}
input[type=text],input[type=email],input[type=password],input[type=number],select{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:#06101e;color:var(--text);font-family:monospace;font-size:14px;margin-top:6px}
textarea{width:100%;min-height:120px;padding:12px;border-radius:8px;border:1px solid var(--line);background:#06101e;color:var(--text);font-family:monospace;font-size:14px;margin-top:6px;direction:ltr;text-align:left;white-space:pre;overflow-x:auto}
.btn{padding:10px 16px;border-radius:8px;border:none;font-weight:bold;cursor:pointer;font-size:14px;margin-bottom:5px;display:inline-block;text-decoration:none;transition:0.3s;text-align:center}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#071019}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:6px}
.btn:active{transform:scale(.95)}
.btn.copy-btn{background:#06101e;color:var(--acc);border:1px solid var(--line)}
.btn-nav{display:flex;gap:4px;margin-bottom:15px;overflow-x:auto}
.btn-nav button{flex:1;padding:8px 6px;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:8px;cursor:pointer;font-weight:bold;white-space:nowrap;font-size:12px}
.btn-nav button.active{background:var(--acc);color:#071019;border-color:var(--acc)}
.feed-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:center;background:var(--card2);flex-shrink:0}
.user-badge-box{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:12px;font-size:13px;font-weight:bold;background:var(--card2);border:1px solid var(--line);cursor:pointer}
.verified-badge{color:#4cc9f0;font-size:14px;vertical-align:middle;text-shadow:0 0 8px rgba(76,201,240,0.6)}
.frame-fire{border:3px solid #ff4500;box-shadow:0 0 15px #ff4500}
.frame-superadmin{border:3px solid #ff6b6b;box-shadow:0 0 20px #ff6b6b}
.frame-neon{border:3px solid var(--acc);box-shadow:0 0 15px var(--acc)}
.frame-gold{border:3px solid #f59e0b;box-shadow:0 0 15px #f59e0b}
.frame-none{border:2px solid var(--line)}
#authScreen{max-width:400px;margin:40px auto;background:var(--card);padding:20px;border-radius:var(--r);border:1px solid var(--line);text-align:center}
#authScreen input{margin-bottom:10px}
#authScreen .toggle-btn{background:none;border:none;color:var(--acc);cursor:pointer;font-size:13px;margin-top:10px;text-decoration:underline}
.saved-item{border:1px solid var(--line);border-radius:10px;margin-bottom:15px;background:var(--card2);overflow:hidden}
.saved-content{padding:14px}
.saved-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:10px}
.saved-title{font-weight:bold;font-size:16px;color:var(--acc)}
.tiktok-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:20px;overflow:hidden}
.tiktok-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.tiktok-media{width:100%;max-height:380px;object-fit:cover;background:#000;display:block}
.tiktok-actions{display:flex;gap:15px;padding:10px 14px;align-items:center;border-top:1px solid var(--line);background:var(--card2)}
.tiktok-action-btn{background:none;border:none;color:#fff;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-weight:bold}
.tiktok-action-btn.liked{color:var(--bad)}
.bell-btn{position:relative;background:var(--card2);border:1px solid var(--line);color:var(--text);padding:6px 10px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.badge-count{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:10px;padding:2px 5px;border-radius:50%;font-weight:bold;display:none}
.notifications-dropdown{position:absolute;top:50px;left:14px;width:280px;max-height:300px;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);z-index:1000;padding:10px;display:none}
.notif-item{font-size:11px;padding:6px;border-bottom:1px solid var(--line);margin-bottom:4px;background:var(--card2);border-radius:6px}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:flex;justify-content:center;align-items:center;z-index:999;padding:15px}
.modal-content{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.accounts-modal{position:absolute;top:55px;right:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;width:250px;z-index:1000;display:none;box-shadow:0 10px 25px rgba(0,0,0,0.5)}
.hidden{display:none!important}
.preview-box{width:120px;height:120px;border-radius:50%;object-fit:cover;border:2px solid var(--acc);background:#000;margin:10px auto;display:block}
.banner-preview{width:100%;height:100px;background-size:cover;background-position:center;border-radius:8px;border:1px solid var(--line);margin:8px 0;background-color:#1f2d4a}
.upload-section{border:1px dashed var(--acc);border-radius:10px;padding:12px;margin:10px 0;background:rgba(76,201,240,0.05)}
.upload-status{font-size:11px;margin-top:6px;padding:8px;border-radius:6px;text-align:center;font-weight:bold}
.upload-status.ok{background:rgba(61,220,151,0.15);color:var(--ok);border:1px solid var(--ok)}
.upload-status.err{background:rgba(255,107,107,0.15);color:var(--bad);border:1px solid var(--bad)}
.upload-status.loading{background:rgba(245,158,11,0.15);color:var(--warn);border:1px solid var(--warn)}
.script-image-preview{display:block;width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-top:8px;border:1px solid var(--line)}
.script-card-image{width:100%;height:160px;object-fit:cover;display:block;background:#000;border-bottom:1px solid var(--line)}
.result-box{background:rgba(61,220,151,0.15);border:1px solid var(--ok);padding:12px;border-radius:8px;margin-top:15px}
.result-box h4{color:var(--ok);margin:0 0 8px}
.result-box label{color:var(--text);font-size:12px;margin-top:8px;display:block}
.result-box .url-input{font-size:11px;padding:8px;margin-top:4px;background:#06101e;color:var(--acc);border:1px solid var(--line);border-radius:6px;width:100%;direction:ltr;text-align:left}
.result-box textarea{font-size:11px;color:var(--ok);min-height:60px;margin-top:4px}
</style>
</head>
<body id="appBody" style="background-color:var(--bg)">

<!-- ===== RAW MODE ===== -->
<script>
(function(){
    const rawParam = new URLSearchParams(window.location.search).get('raw');
    if (rawParam !== null) {
        window.__RAW_MODE__ = true;
        try {
            const code = decodeURIComponent(escape(atob(rawParam)));
            document.documentElement.innerHTML = '<head><meta charset="utf-8"><title>Delta Raw</title></head><body style="background:#fff;color:#000;font-family:Consolas,Monaco,monospace;padding:20px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;margin:0"></body>';
            const pre = document.createElement('pre');
            pre.style.margin = '0';
            pre.textContent = code;
            document.body.appendChild(pre);
        } catch(e) {
            document.documentElement.innerHTML = '<body style="background:#000;color:#f00;padding:20px;font-family:monospace">Error: '+e.message+'</body>';
        }
    }
})();
</script>

<!-- شاشة الدخول -->
<div id="authScreen" class="hidden">
    <h2>منصة دلتا</h2>
    <div id="loginForm">
        <label>البريد الإلكتروني</label>
        <input type="email" id="loginEmail" placeholder="email@example.com">
        <label style="margin-top:8px">كلمة المرور</label>
        <input type="password" id="loginPass" placeholder="••••••••">
        <button class="btn primary" style="width:100%;margin-top:10px" onclick="doLogin()">تسجيل الدخول</button>
        <button class="toggle-btn" onclick="toggleAuth('register')">حساب جديد؟ اضغط هنا</button>
    </div>
    <div id="registerForm" class="hidden">
        <h3>إنشاء حساب جديد 🛡️</h3>
        <label>اسم المستخدم</label>
        <input type="text" id="regUsername" placeholder="اسمك...">
        <label style="margin-top:8px">البريد الإلكتروني</label>
        <input type="email" id="regEmail" placeholder="email@example.com">
        <label style="margin-top:8px">كلمة المرور</label>
        <input type="password" id="regPass" placeholder="••••••••">
        <button class="btn primary" style="width:100%;margin-top:10px" onclick="doRegister()">تأكيد وفتح الحساب 🚀</button>
        <button class="toggle-btn" onclick="toggleAuth('login')">عندك حساب؟ سجل دخولك</button>
    </div>
</div>

<div class="wrap" id="mainUI">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <div style="display:flex;align-items:center;gap:8px;position:relative">
          <button class="btn sm primary" onclick="toggleAccountsMenu()" style="font-size:16px;padding:4px 10px">➕</button>
          <div id="accountsDropdown" class="accounts-modal">
              <h4 style="margin:0 0 8px;font-size:12px;color:var(--acc)">حساباتك:</h4>
              <div id="savedAccountsList" style="margin-bottom:8px"></div>
              <div style="display:flex;gap:5px;border-top:1px solid var(--line);padding-top:8px">
                  <button class="btn sm primary" style="flex:1" onclick="openAuthModalForAction('login')">دخول</button>
                  <button class="btn sm" style="flex:1;background:var(--card2);color:var(--acc);border:1px solid var(--line)" onclick="openAuthModalForAction('register')">تسجيل</button>
              </div>
          </div>
          <div id="userHeaderDisplay" style="display:inline-block"></div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;position:relative">
          <button class="bell-btn" onclick="toggleNotifications()">🔔<span id="notifBadge" class="badge-count">0</span></button>
          <div id="notifDropdown" class="notifications-dropdown">
              <h4 style="margin:0 0 8px;font-size:12px;color:var(--acc)">التنبيهات:</h4>
              <div id="notifList">لا توجد.</div>
          </div>
          <button class="btn sm" onclick="confirmLogout()" style="background:transparent;color:var(--bad);border:1px solid var(--bad);margin-bottom:0">خروج</button>
      </div>
  </div>

  <div class="btn-nav">
      <button id="navAdd" class="active" onclick="switchTab('add')">نشر سكريبت</button>
      <button id="navTok" onclick="switchTab('tok')">🎬 دلتا توك</button>
      <button id="navObf" onclick="switchTab('obf')">تمويه</button>
      <button id="navMy" onclick="switchTab('my')">سكريبتاتي</button>
      <button id="navComm" onclick="switchTab('comm')">المجتمع</button>
      <button id="navChat" onclick="switchTab('chat')">المراسلات</button>
  </div>

  <!-- ===== نشر سكريبت ===== -->
  <div id="tabAdd">
      <div class="card">
        <h3>🚀 نشر سكريبت جديد</h3>
        <label>اسم السكريبت
          <input type="text" id="scriptName" placeholder="مثلاً: سكريبت طيران">
        </label>
        <label>التصنيف
          <select id="scriptCategory">
              <option value="عام">عام</option>
              <option value="MM2">MM2</option>
              <option value="ماب السرقة">ماب السرقة</option>
              <option value="تايم بومب">تايم بومب</option>
          </select>
        </label>

        <label>صورة السكريبت (اختياري)
          <button class="btn primary" type="button" style="width:100%;margin-top:6px" onclick="document.getElementById('scriptImageInput').click()">📸 اختيار صورة</button>
          <input type="file" id="scriptImageInput" accept="image/*" style="display:none" onchange="handleScriptImageUpload(event)">
          <input type="hidden" id="scriptImageData">
          <img id="scriptImagePreview" class="script-image-preview" style="display:none">
        </label>

        <label style="margin-top:15px">كود السكريبت (Lua)
          <textarea id="scriptCode" placeholder="-- اكتب الكود هنا" spellcheck="false"></textarea>
        </label>

        <button class="btn primary" onclick="publishScript()" style="width:100%;margin-top:10px">🔥 نشر والحصول على الروابط</button>
        <div id="resultArea"></div>
      </div>
  </div>

  <!-- ===== دلتا توك ===== -->
  <div id="tabTok" class="hidden">
      <div class="card">
          <h3>🎬 نشر فيديو</h3>
          <label>الوصف<input type="text" id="tokCaption" placeholder="الوصف..."></label>
          <label>الخصوصية
              <select id="tokPrivacy">
                  <option value="public">🌐 عام</option>
                  <option value="followers">🔒 للمتابعين</option>
              </select>
          </label>
          <button class="btn primary" style="width:100%" onclick="document.getElementById('tokMediaInput').click()">📁 اختيار فيديو</button>
          <input type="file" id="tokMediaInput" accept="video/*,audio/*" style="display:none" onchange="handleTokMediaUpload(event)">
          <input type="hidden" id="tokMediaData">
          <video id="tokVideoPreview" style="display:none;width:100%;max-height:150px;margin-top:8px" muted controls></video>
          <button class="btn primary" onclick="publishTokPost()" style="width:100%;margin-top:10px">🚀 نشر</button>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:12px">
          <button class="btn sm primary" id="tokFeedAll" onclick="setTokFeedMode('all')">🌐 الكل</button>
          <button class="btn sm" id="tokFeedFollowing" onclick="setTokFeedMode('following')" style="background:var(--card2);color:var(--acc);border:1px solid var(--line)">⭐ المتابَعون</button>
      </div>
      <div id="deltaTokFeed"><p style="color:var(--muted);text-align:center">جاري التحميل...</p></div>
  </div>

  <!-- ===== التمويه ===== -->
  <div id="tabObf" class="hidden">
      <div class="card">
          <h3>تمويه السكريبت</h3>
          <textarea id="plainCode" placeholder="-- الكود هنا --" spellcheck="false"></textarea>
          <button class="btn primary" style="width:100%;margin-top:10px" onclick="obfuscateCode()">🔐 تمويه</button>
          <label style="margin-top:15px">الكود المموه</label>
          <textarea id="encryptedCode" readonly spellcheck="false"></textarea>
          <button class="btn copy-btn" style="width:100%;margin-top:5px" onclick="copyText(document.getElementById('encryptedCode').value, this)">📋 نسخ</button>
      </div>
  </div>

  <!-- ===== سكريبتاتي ===== -->
  <div id="tabMy" class="hidden">
      <div class="card">
          <h3>📂 سكريبتاتي</h3>
          <div id="myScriptsList"><p style="color:var(--muted);text-align:center">لا توجد سكريبتات.</p></div>
      </div>
  </div>

  <!-- ===== المجتمع ===== -->
  <div id="tabComm" class="hidden">
      <div class="card" style="padding:10px">
          <input type="text" id="searchInput" placeholder="ابحث..." oninput="renderCommunity()" style="margin-top:0">
      </div>
      <div id="communityList"><p style="color:var(--muted);text-align:center">المجتمع فاضي.</p></div>
  </div>

  <!-- ===== المراسلات ===== -->
  <div id="tabChat" class="hidden">
      <div class="card">
          <h3>👥 المحادثات</h3>
          <input type="text" id="userSearchInput" placeholder="ابحث عن مستخدم..." oninput="searchUsers()" style="margin-bottom:12px">
          <div id="userSearchResults" style="margin-bottom:15px"></div>
          <div id="activeChatBox" class="hidden">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                  <span id="chatWithTitle" style="font-weight:bold;color:var(--acc)">المحادثة: -</span>
                  <button class="btn sm" onclick="closeChat()" style="background:var(--bad);color:white">إغلاق</button>
              </div>
              <div class="card" style="height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:8px" id="chatMessages"></div>
              <div style="display:flex;gap:6px">
                  <input type="text" id="chatMsgInput" placeholder="رسالتك..." style="margin-top:0;flex:1">
                  <button class="btn sm primary" onclick="sendChatMessage()">إرسال</button>
              </div>
          </div>
      </div>
  </div>
</div>

<!-- ===== بروفايل ===== -->
<div id="profileModal" class="modal-overlay hidden">
    <div class="modal-content" style="padding:0;overflow:hidden">
        <div id="bannerContainer" style="width:100%;height:110px;background:#1f2d4a;background-size:cover;background-position:center"></div>
        <div style="padding:15px;text-align:center">
            <img id="profileModalAvatar" src="" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid var(--acc);margin:-50px auto 10px;display:block;background:#000">
            <h3 id="profileModalUsername" style="margin:5px 0;color:var(--acc)">اسم المستخدم</h3>

            <div id="aiVerifyStatusBox" style="background:rgba(76,201,240,0.15);border:1px solid var(--acc);color:var(--acc);padding:8px;border-radius:6px;font-size:12px;margin-bottom:10px;font-weight:bold;text-align:center">🤖 جارٍ الفحص...</div>

            <div class="upload-section">
                <label style="color:var(--acc);font-size:13px">🖼️ الصورة الشخصية (GIF متحرك / أي حجم)</label>
                <button class="btn primary" style="width:100%" onclick="document.getElementById('avatarFileInput').click()">📁 اختيار صورة</button>
                <input type="file" id="avatarFileInput" accept="image/*" style="display:none" onchange="onAvatarSelect(event)">
                <img id="avatarPreviewImg" class="preview-box hidden">
                <button id="saveAvatarBtn" class="btn primary hidden" style="width:100%;margin-top:8px" onclick="saveMediaToCloud('avatar')">💾 حفظ الصورة الشخصية</button>
                <div id="avatarStatus" class="upload-status hidden"></div>
            </div>

            <div class="upload-section">
                <label style="color:var(--acc);font-size:13px">🎨 البانر (GIF متحرك / أي حجم)</label>
                <button class="btn primary" style="width:100%" onclick="document.getElementById('bannerFileInput').click()">📁 اختيار البانر</button>
                <input type="file" id="bannerFileInput" accept="image/*" style="display:none" onchange="onBannerSelect(event)">
                <div id="bannerPreviewBox" class="banner-preview hidden"></div>
                <button id="saveBannerBtn" class="btn primary hidden" style="width:100%;margin-top:8px" onclick="saveMediaToCloud('banner')">💾 حفظ البانر</button>
                <div id="bannerStatus" class="upload-status hidden"></div>
            </div>

            <div id="adminVerifyControlBox" class="card" style="background:var(--card2);padding:10px;border-radius:8px;margin:10px 0;text-align:right;display:none">
                <label style="color:var(--warn);font-size:12px">👑 تحكم الأدمن:</label>
                <div style="display:flex;gap:6px">
                    <input type="number" id="requiredFollowersInput" value="5" min="1" style="margin-top:0;padding:6px;font-size:13px">
                    <button class="btn sm primary" onclick="saveRequiredFollowersSetting()">حفظ</button>
                </div>
            </div>

            <div style="background:var(--card2);padding:10px;border-radius:8px;margin:10px 0;text-align:right">
                <label style="color:var(--acc);font-size:12px">🖼️ الإطار:</label>
                <select id="frameSelect" onchange="updateProfileAttr('frame', this.value)" style="margin-top:0;font-size:12px;padding:8px">
                    <option value="fire">🔥 نار</option>
                    <option value="superadmin">🔴 أدمن</option>
                    <option value="neon">💎 نيون</option>
                    <option value="gold">🥇 ذهبي</option>
                    <option value="none">❌ بدون</option>
                </select>
                <label style="color:var(--acc);font-size:12px;margin:10px 0 4px">🎨 الخلفية:</label>
                <select id="bgThemeSelect" onchange="updateBackgroundTheme(this.value)" style="margin-top:0;font-size:12px;padding:8px">
                    <option value="#0b1220">🌑 غامق</option>
                    <option value="#1a1a2e">🌌 ليلي</option>
                    <option value="#f0f4f8">☀️ فاتح</option>
                </select>
            </div>

            <div style="display:flex;justify-content:center;gap:20px;margin:15px 0;font-size:14px;background:var(--card2);padding:10px;border-radius:8px">
                <div><b>متابعون:</b> <span id="statFollowers">0</span></div>
                <div><b>تتابع:</b> <span id="statFollowing">0</span></div>
            </div>

            <button class="btn" style="background:var(--bad);color:white;width:100%" onclick="closeProfileModal()">إغلاق</button>
        </div>
    </div>
</div>

<script type="module">
  if (window.__RAW_MODE__) { await new Promise(() => {}); }

  // ===== IndexedDB =====
  const MEDIA_DB='DeltaMediaDB', STORE='media';
  let mediaDB=null;
  function openMediaDB(){
    return new Promise((res,rej)=>{
      if(mediaDB) return res(mediaDB);
      const r=indexedDB.open(MEDIA_DB,1);
      r.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains(STORE))e.target.result.createObjectStore(STORE);};
      r.onsuccess=()=>{mediaDB=r.result;res(mediaDB);};
      r.onerror=()=>rej(r.error);
    });
  }
  async function mediaSet(k,b){const db=await openMediaDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(b,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}
  async function mediaGet(k){const db=await openMediaDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly');const r=tx.objectStore(STORE).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
  function formatSize(b){if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';if(b<1073741824)return (b/1048576).toFixed(2)+' MB';return (b/1073741824).toFixed(2)+' GB';}
  function fileToBase64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(f);});}
  async function uploadToCatbox(file){
    const fd=new FormData();fd.append('reqtype','fileupload');fd.append('fileToUpload',file);
    const r=await fetch('https://catbox.moe/user/api.php',{method:'POST',body:fd});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const u=(await r.text()).trim();
    if(!u.startsWith('https://'))throw new Error('Invalid: '+u.slice(0,80));
    return u;
  }

  window.saveMediaToCloud=async function(type){
    const file=type==='avatar'?pendingAvatarFile:pendingBannerFile;
    if(!file)return alert('اختر صورة!');
    const st=document.getElementById(type+'Status');
    const show=(c,m)=>{st.className='upload-status '+c;st.textContent=m;st.classList.remove('hidden');};
    show('loading','⏳ 1/3 حفظ محلي...');
    const key=`${currentUsername}_${type}`;
    try{await mediaSet(key,file);}catch(e){console.warn(e);}
    show('loading','⏳ 2/3 رفع على Catbox...');
    let cloud=null;
    try{cloud=await uploadToCatbox(file);}catch(e){console.warn(e);}
    let fsVal=null;
    if(cloud)fsVal=cloud;
    else if(file.size<700*1024){show('loading','⏳ 3/3 Base64...');try{fsVal=await fileToBase64(file);}catch(e){}}
    else fsVal=`local:${key}`;
    if(fsVal&&currentUserDocId){
      try{const u={};u[type]=fsVal;await updateDoc(doc(db,'users',currentUserDocId),u);}catch(e){console.warn(e);}
    }
    const obj=URL.createObjectURL(file);
    if(type==='avatar'){currentUserAvatarURL=obj;document.getElementById('profileModalAvatar').src=obj;}
    else{currentUserBannerURL=obj;document.getElementById('bannerContainer').style.backgroundImage=`url(${obj})`;}

  };

  window.handleScriptImageUpload=function(e){
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement('canvas');
        const maxW=500;
        const s=Math.min(1,maxW/img.width);
        c.width=img.width*s;c.height=img.height*s;
        const ctx=c.getContext('2d');
        ctx.drawImage(img,0,0,c.width,c.height);
        const dataUrl=c.toDataURL('image/jpeg',0.6);
        document.getElementById('scriptImageData').value=dataUrl;
        const prev=document.getElementById('scriptImagePreview');
        prev.src=dataUrl;prev.style.display='block';
      };
      img.src=ev.target.result;
    };
    r.readAsDataURL(f);
  };

  // ===== User Info =====
  function getUserProfileInfo(username){
    const u=allUsersCache.find(x=>x.username===username);
    let avatar;
    if(username===currentUsername&&currentUserAvatarURL)avatar=currentUserAvatarURL;
    else if(u&&u.avatar&&!u.avatar.startsWith('local:'))avatar=u.avatar;
    else avatar=DEFAULT_AVATAR;
    const frame=u&&u.frame?u.frame:'fire';
    let fc='frame-fire';
    if(frame==='superadmin')fc='frame-superadmin';
    else if(frame==='neon')fc='frame-neon';
    else if(frame==='gold')fc='frame-gold';
    else if(frame==='none')fc='frame-none';
    const fcount=allFollowsCache.filter(f=>f.target===username).length;
    const low=username.toLowerCase();
    const verified=(low==='super admin'||low==='admin'||low==='superadmin'||fcount>=globalRequiredFollowers);
    return{avatar,frameClass:fc,isVerified:verified};
  }

        <img src="${img}" class="script-card-image" onerror="this.src='${getDefaultImage(s.category)}'">
        <div class="saved-content">
          <div class="saved-header">
            <div><span class="saved-title">${s.name}</span> <span style="font-size:11px;background:rgba(179,136,255,0.2);color:var(--acc2);padding:3px 8px;border-radius:4px;font-weight:bold">${s.category}</span></div>
          </div>
          <div style="font-size:12px;color:var(--muted);margin-top:6px">بواسطة: ${s.author}</div>
          <textarea readonly style="min-height:45px;font-size:11px;color:var(--ok);margin-top:8px">${lua}</textarea>
          <button class="btn copy-btn" style="width:100%;margin-top:5px" onclick="copyText(this.previousElementSibling.value,this)">📋 نسخ Loadstring</button>
        </div></div>`;
    }).join('');
  };

  // ===== دلتا توك =====
  window.handleTokMediaUpload=(e)=>{
    const f=e.target.files[0];if(!f)return;
    const url=URL.createObjectURL(f);
    document.getElementById('tokMediaData').value=url;
    const v=document.getElementById('tokVideoPreview');
    v.src=url;v.style.display='block';
  };
  window.publishTokPost=async()=>{
    const c=document.getElementById('tokCaption').value.trim();
    const m=document.getElementById('tokMediaData').value;
    const p=document.getElementById('tokPrivacy').value;
    if(!m)return alert('ارفع فيديو!');
    try{
      await addDoc(collection(db,"tok_posts"),{author:currentUsername,caption:c,mediaData:m,privacy:p,createdAt:serverTimestamp()});
      document.getElementById('tokCaption').value='';
      document.getElementById('tokMediaData').value='';
      document.getElementById('tokVideoPreview').style.display='none';
      alert('✅ تم!');
    }catch(e){alert("خطأ: "+e.message);}
  };
  window.setTokFeedMode=(mode)=>{
    tokFeedMode=mode;
    document.getElementById('tokFeedAll').style.background=mode==='all'?'var(--acc)':'var(--card2)';
    document.getElementById('tokFeedAll').style.color=mode==='all'?'#071019':'var(--acc)';
    document.getElementById('tokFeedFollowing').style.background=mode==='following'?'var(--acc)':'var(--card2)';
    document.getElementById('tokFeedFollowing').style.color=mode==='following'?'#071019':'var(--acc)';
    renderTokFeed();
  };
  function renderTokFeed(){
    const feed=document.getElementById('deltaTokFeed');
    let posts=allTokPostsCache;
    const low=currentUsername.toLowerCase();
    const isSuper=low==='super admin'||low==='admin'||low==='superadmin';
    posts=posts.filter(p=>{
      if(isSuper||p.author===currentUsername)return true;
      const ad=allUsersCache.find(u=>u.username===p.author);
      if(ad&&ad.privacy==='private')return allFollowsCache.some(f=>(f.user===currentUsername&&f.target===p.author)||(f.user===p.author&&f.target===currentUsername));
      if(p.privacy==='public')return true;
      return allFollowsCache.some(f=>(f.user===currentUsername&&f.target===p.author)||(f.user===p.author&&f.target===currentUsername));
    });
    if(tokFeedMode==='following'){
      const fl=allFollowsCache.filter(f=>f.user===currentUsername).map(f=>f.target);
      posts=posts.filter(p=>fl.includes(p.author)||p.author===currentUsername);
    }
    feed.innerHTML=posts.length?posts.map(p=>{
      const likes=allTokLikesCache.filter(l=>l.postId===p.id);
      const hl=likes.some(l=>l.user===currentUsername);
      const isF=allFollowsCache.some(f=>f.user===currentUsername&&f.target===p.author);
      const ai=getUserProfileInfo(p.author);
      return `<div class="tiktok-card">
        <div class="tiktok-header">
          <div style="display:flex;align-items:center;gap:8px">
            <img src="${ai.avatar}" class="feed-avatar ${ai.frameClass}">
            <span style="font-weight:bold;color:var(--acc)">👤 ${p.author} ${ai.isVerified?'<span class="verified-badge">✔</span>':''}</span>
          </div>
          ${p.author!==currentUsername?`<button class="btn sm ${isF?'':'primary'}" onclick="toggleFollow('${p.author}')">${isF?'✓ متابَع':'➕ متابعة'}</button>`:''}
        </div>
        <video src="${p.mediaData}" class="tiktok-media" muted controls></video>
        <div style="padding:10px 14px;font-size:13px">${p.caption}</div>
        <div class="tiktok-actions">
          <button class="tiktok-action-btn ${hl?'liked':''}" onclick="toggleTokLike('${p.id}')">❤️ <span>${likes.length}</span></button>
        </div>
      </div>`;
    }).join(''):'<p style="color:var(--muted);text-align:center">لا توجد فيديوهات.</p>';
  }
  window.toggleFollow=async(target)=>{
    const ex=allFollowsCache.filter(f=>f.user===currentUsername&&f.target===target);
    if(ex.length>0)for(let e of ex)await deleteDoc(doc(db,"follows",e.id));
    else await addDoc(collection(db,"follows"),{user:currentUsername,target:target});
  };
  window.toggleTokLike=async(pid)=>{
    const ex=allTokLikesCache.filter(l=>l.postId===pid&&l.user===currentUsername);
    if(ex.length>0)for(let e of ex)await deleteDoc(doc(db,"tok_likes",e.id));
    else await addDoc(collection(db,"tok_likes"),{postId:pid,user:currentUsername});
  };

  // ===== المراسلات =====
  window.searchUsers=()=>{
    const q=document.getElementById('userSearchInput').value.toLowerCase();
    const res=document.getElementById('userSearchResults');
    if(!q){res.innerHTML='';return;}
    const found=allUsersCache.filter(u=>u.username.toLowerCase().includes(q)&&u.username!==currentUsername);
    res.innerHTML=found.length?found.map(u=>{
      const ui=getUserProfileInfo(u.username);
      return `<div style="display:flex;align-items:center;gap:8px;padding:8px;background:var(--card2);border-radius:8px;margin-bottom:6px">
        <img src="${ui.avatar}" class="feed-avatar ${ui.frameClass}">
        <span style="flex:1;font-weight:bold">${u.username}</span>
        <button class="btn sm primary" onclick="openChat('${u.username}')">💬 فتح</button>
      </div>`;
    }).join(''):'<p style="color:var(--muted);text-align:center;font-size:12px">مفيش نتائج.</p>';
  };
  window.openChat=(username)=>{
    currentChatWith=username;
    document.getElementById('chatWithTitle').textContent='المحادثة مع: '+username;
    document.getElementById('activeChatBox').classList.remove('hidden');
    renderChatMessages();
  };
  window.closeChat=()=>{currentChatWith=null;document.getElementById('activeChatBox').classList.add('hidden');};
  function renderChatMessages(){
    if(!currentChatWith)return;
    const msgs=allChatsCache.filter(m=>(m.from===currentUsername&&m.to===currentChatWith)||(m.from===currentChatWith&&m.to===currentUsername)).sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
    const box=document.getElementById('chatMessages');
    box.innerHTML=msgs.length?msgs.map(m=>{
      const mine=m.from===currentUsername;
      return `<div style="align-self:${mine?'flex-end':'flex-start'};background:${mine?'var(--acc)':'var(--card2)'};color:${mine?'#071019':'var(--text)'};padding:8px 12px;border-radius:10px;max-width:80%;font-size:13px">${m.text}</div>`;
    }).join(''):'<p style="color:var(--muted);text-align:center;font-size:12px">ابدأ المحادثة...</p>';
    box.scrollTop=box.scrollHeight;
  }
  window.sendChatMessage=async()=>{
    const t=document.getElementById('chatMsgInput').value.trim();
    if(!t||!currentChatWith)return;
    try{
      await addDoc(collection(db,"chats"),{from:currentUsername,to:currentChatWith,text:t,createdAt:serverTimestamp()});
      document.getElementById('chatMsgInput').value='';
    }catch(e){alert("خطأ: "+e.message);}
  };

  // ===== التمويه =====
  window.obfuscateCode=()=>{
    const p=document.getElementById('plainCode').value;
    if(!p)return alert('اكتب الكود!');
    const u=new TextEncoder().encode(p);
    const eb=[];for(let i=0;i<u.length;i++)eb.push(u[i]^DELTA_KEY.charCodeAt(i%DELTA_KEY.length));
    document.getElementById('encryptedCode').value=`local _k="${DELTA_KEY}"\nlocal _e={${eb.join(',')}}\nlocal _s=""\nfor i=1,#_e do\n  local _kc=string.byte(_k,(i-1)%#_k+1)\n  _s=_s..string.char(bit32.bxor(_e[i],_kc))\nend\nassert(loadstring(_s))()`;
  };

  // ===== إشعارات =====
  window.toggleNotifications=()=>{
    const d=document.getElementById('notifDropdown');
    d.style.display=d.style.display==='block'?'none':'block';
  };
  function renderNotifications(){
    const b=document.getElementById('notifBadge');
    const ur=notifsCache.filter(n=>!n.read);
    if(ur.length>0){b.textContent=ur.length;b.style.display='inline-block';}else b.style.display='none';
    document.getElementById('notifList').innerHTML=notifsCache.length?notifsCache.map(n=>`<div class="notif-item">${n.message}</div>`).join(''):'<div style="font-size:11px;color:var(--muted);text-align:center">لا تنبيهات.</div>';
  }

  window.copyText=(text,btn)=>{
    navigator.clipboard.writeText(text).then(()=>{
      const old=btn.textContent;
      btn.textContent='✓ تم';
      setTimeout(()=>{btn.textContent=old;},1200);
    });
  };
</script>
</body>
    </html>
